<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Global Purple Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      background-color: #5e17eb;
      border-radius: 10px;
      padding: 20px;
      width: 400px;
      box-shadow: 0 0 20px rgba(94, 23, 235, 0.5);
    }

    #chat-box {
      background-color: #320e88;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    input[type="text"] {
      width: calc(100% - 70px);
      padding: 8px;
      border: none;
      border-radius: 5px;
      margin-right: 5px;
    }

    button {
      padding: 8px;
      background-color: #a970ff;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #username {
      margin-bottom: 10px;
      width: 100%;
    }

    .message {
      margin: 5px 0;
    }

    .name {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <input type="text" id="username" placeholder="Your name">
    <div id="chat-box"></div>
    <input type="text" id="message" placeholder="Type a message">
    <button id="sendBtn">Send</button>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    // Import Firebase functions
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // ✅ Replace this with YOUR actual Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, "messages");

    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.addEventListener("click", () => {
      const name = document.getElementById("username").value.trim() || "Anonymous";
      const text = document.getElementById("message").value.trim();
      if (text !== "") {
        push(messagesRef, { name, text });
        document.getElementById("message").value = "";
      }
    });

    // Listen for new messages
    onChildAdded(messagesRef, (data) => {
      const msg = data.val();
      const div = document.createElement("div");
      div.classList.add("message");
      div.innerHTML = `<span class="name">${msg.name}:</span> ${msg.text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
